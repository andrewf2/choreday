# Fly.io configuration for Chore Checker AI.
# The SQLite DB and uploaded photos live on a single persistent volume (/data),
# so this app runs as ONE machine (a volume can't be shared across machines).

app = "choreday"
primary_region = "den"

[build]

[env]
  # SQLite database on the volume.
  CHOREDAY_DATABASE_URL = "file:/data/prod.db"
  # Uploaded photos on the volume.
  UPLOADS_DIR = "/data/uploads"
  # Model used for AI evaluation (override here if desired).
  CHORE_AI_MODEL = "claude-sonnet-4-6"
  # ANTHROPIC_API_KEY is NOT set here — store it as a secret:
  #   fly secrets set ANTHROPIC_API_KEY=sk-ant-...

[http_service]
  internal_port = 3500
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Single instance, and allow it to scale to zero when idle to save money.
  min_machines_running = 0

[[mounts]]
  source = "choreday_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
