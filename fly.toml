# fly.toml app configuration file generated for choreday on 2026-06-09T20:41:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'choreday'
primary_region = 'dfw'

[build]

[env]
  CHOREDAY_DATABASE_URL = 'file:/data/prod.db'
  CHORE_AI_MODEL = 'claude-sonnet-4-6'
  UPLOADS_DIR = '/data/uploads'

[[mounts]]
  source = 'choreday_data'
  destination = '/data'

[http_service]
  internal_port = 3500
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
